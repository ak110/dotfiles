[tools]
"npm:@google/gemini-cli" = "latest"
"npm:aws-cdk" = "latest"
# actionlintの配布物はインストールrootへ実行ファイルと並んで`man`・`docs`のディレクトリを展開する。
# `symlink_bins`のような実行ファイルの配置を変える設定は、miseが導入時にだけ当該配置を生成し、
# 導入済みの版へ遡及して生成しない。このため当該設定を後から加えると`mise which`が解決に失敗する。
# 2026年9月8日にcommit 7c3ba236で当該設定を加えたところ、pre-commitとCIのactionlint実行が停止した。
# 配置を変える設定を加える場合は、同じ変更で全対象環境の再インストールを成立させてから加える。
actionlint = "latest"
chezmoi = "latest"
# dotnetは共有ランタイムのルートへのsymlinkとして導入される。symlinkで導入済みの版は
# `latest`のような曖昧な版指定の解決でmise.lockの確定バージョンより優先されるため、
# 版を明示してこの解決経路を通さない。版の更新は`make update`が`mise upgrade --bump`で行う。
dotnet = "10.0.400"
# editorconfig-checkerはv4.0.0で配布物と実行ファイルの接頭辞が`ec`から`editorconfig-checker`へ変わり、
# 旧名のアセットが削除された。aqua backendの定義は旧名のアセットを要求するため、v4以降を解決できない。
# GitHub Releaseを直接参照するbackendを指定して上流の配布物名へ追随する。実行ファイル名は`editorconfig-checker`になる。
"github:editorconfig-checker/editorconfig-checker" = "latest"
fzf = "latest"
gh = "latest"
git-cliff = "latest"
glab = "latest"
glow = "latest"
jq = "latest"
node = "lts"
pinact = "latest"
ripgrep = "latest"
shellcheck = "latest"
shfmt = "latest"
typos = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
lockfile = true
minimum_release_age = "168h"

# miseはglab CLIの設定ファイルからトークンを取得し、公開プロジェクトの取得へも付与する。
# 期限切れのトークンは401を返すため、匿名で取得する。
[settings.gitlab]
glab_cli_tokens = false
