[project]
name = "agent-toolkit"
version = "0.1.0"
description = "Coding agent workflow toolkit"
# 配布先のエンドユーザー環境はリポジトリ直下より広い版を含むため、下限を3.12とする。
requires-python = ">=3.12"
dependencies = [
    "argcomplete",
    "claude-agent-sdk>=0.2.144,<0.3",
    "filelock>=3.30",
    "markdown-it-py[linkify]>=4.0.0",
    "mcp>=1.28.1,<2",
    "mdit-py-plugins>=0.6",
    "platformdirs>=4.0",
    "psutil>=6",
    "pydantic>=2",
    "pyfltr>=3.17.7",
    "pytilpack[quart]>=1.47.0",
    "pyyaml",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# サプライチェーン攻撃対策: 公開直後の新バージョンは1日待ってから取り込む
exclude-newer = "1 day"
exclude-newer-package = { pyfltr = false, pytilpack = false }
# semgrepがmcpを完全一致でピン留めしており、単一バージョン解決の下で
# プロジェクト全体のmcpが脆弱版に固定されるため上書きする。
# mcp 2.0.0で`mcp.server.fastmcp`が削除され`mcp.server.mcpserver`へ改称されたため上限を設ける。
# 本パッケージのMCPサーバースクリプトがmcpを直接importするため、上限なしの指定は推移依存の解決へ破壊的変更を持ち込む。
# 上限の解除条件: mcpをピン留めする上流パッケージのピンが2系を含む版へ更新され、
# その版で`uv lock`が上限なしでも解決できることを実測した時点で`<2`を外す。
override-dependencies = ["mcp>=1.28.1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["agent_toolkit"]
exclude = ["agent_toolkit/**/*_test.py"]

[dependency-groups]
dev = [
    "jsonschema>=4.26",
    "playwright>=1.61.0",
    "pyfltr[python]>=3.17.7",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2",
    "pytest-xdist>=3.8.0",
    "types-PyYAML",
]

# pyfltrは`agent-toolkit/`をsubprojectとして分離し、subprojectの設定をリポジトリ直下の`pyproject.toml`とは
# 独立に解決する。直下の同キーは本subprojectへ届かないため、検査の有無と挙動を決めるキーは本ファイルへも置く。
# 直下と同じ値にするキーにはその旨を、本subproject固有の値にするキーにはその理由をそれぞれ併記する。
[tool.pyfltr]
preset = "latest"
python = true
# Python 3.14は本subprojectのテストsuiteが600秒の境界を超えるため、直下と同じ値をここでも指定する。
command-timeout = 900
ty = true
# 直下は`scripts`と`agent-toolkit/skills/plan-mode/scripts`を探索パスへ加える。
# 本subprojectからは後者だけがsubproject相対で解決できるため、そのパスだけを加える。
ty-args = ["check", "--output-format", "concise", "--error-on-warning", "--extra-search-path", "skills/plan-mode/scripts"]
# pyfltrの既定では`ruff-format`が整形前に`ruff check --fix --unsafe-fixes`を実行する。
# 検査だけを行う`make test`が担当範囲外のファイルを書き換えないよう、直下と同じく無効にする。
ruff-format-by-check = false
# pylintを直列で実行すると本subprojectのモジュール数では律速になるため、直下と同じ並列度を指定する。
pylint-args = ["--jobs=4"]
shellcheck = true
shfmt = true
# 拡張子を持たないbash製CLIラッパーを検査対象へ加える。
shellcheck-extend-targets = ["atk"]
shfmt-extend-targets = ["atk"]
colloquial-check = true
textlint-args = ["--cache"]
lychee-exclude = ["agent_toolkit/_atk/serve/static/index.html"]
# 口調例は意図的な違反例を収録するため検査対象外とする。
extend-exclude = [
    "skills/writing-standards/references/tone-examples.md",
    "skills/writing-standards/references/tone-examples-llm-tone.md",
]
# リポジトリ直下の`.textlintrc.yaml`が参照するruleのうち、利用中のpyfltrの既定の
# `textlint-packages`に含まれないものがあるため、既定のままではruleを解決できず
# "No rules found"で終了コード1となる。直下と同じ内容をここでも指定して解決する。
textlint-packages = [
    "textlint-rule-preset-ja-technical-writing",
    "textlint-rule-preset-jtf-style",
    "textlint-rule-ja-no-abusage",
    # コーディングエージェントのコンテキスト汚染対策として独自強化する辞書を追加する
    "textlint-rule-prh",
    "textlint-rule-preset-ai-words-ja",
]

[tool.pylint."messages control"]
disable = [
    "broad-exception-caught",
    "duplicate-code",
    "fixme",
    "invalid-name",
    "line-too-long",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "no-else-return",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
]

# 既存の重複はarid-baseline.jsonで抑制し、新しい重複だけを検出する。
# 個別の`# arid: disable`と`# arid: enable`による領域抑制は使わない。
[tool.arid]
min-lines = 10
baseline = "arid-baseline.json"

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["D", "E", "F", "UP", "B", "SIM", "ICN", "I"]
ignore = ["D107", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**_test.py" = ["D"]
"**/__init__.py" = ["D104"]

[tool.pyright]
# 計画補助スクリプトが同じscriptsディレクトリのモジュールを共有するため追加する。
extraPaths = ["skills/plan-mode/scripts"]

[tool.mypy]
allow_redefinition = true
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
strict_optional = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[tool.typos.default.extend-words]
# filelockパッケージの実際のAPIパラメータ名（後方互換のため残置されたtypo）
intervall = "intervall"

[tool.pytest.ini_options]
addopts = [
    "--showlocals",
    "-p", "no:cacheprovider",
    "--maxfail=5",
    "--durations=30",
    "--durations-min=0.5",
    "--timeout=60",
    # コア数追従（-n auto等）を採用せず固定値とする（CI環境での逆効果とメモリ消費増を避けるため）
    "-n", "4",
    # 完了したworkerへ未実行テストを動的分配し、特定ファイルへの偏りによる律速を回避する。
    # --dist=loadfileでは最大テストファイルの実行時間が全体の下限になるため、本方式を指定する
    "--dist=worksteal",
]
markers = ["browser: Chromiumを使う実ブラウザー統合テスト"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
