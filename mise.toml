min_version = "2026.8.8"

[tools]
# actionlintの配布物はインストールrootへ実行ファイルと並んで`man`・`docs`のディレクトリを展開する。
# `symlink_bins`のような実行ファイルの配置を変える設定は、miseが導入時にだけ当該配置を生成し、
# 導入済みの版へ遡及して生成しない。このため当該設定を後から加えると`mise which`が解決に失敗する。
# 2026年9月8日にcommit 7c3ba236で当該設定を加えたところ、pre-commitとCIのactionlint実行が停止した。
# 配置を変える設定を加える場合は、同じ変更で全対象環境の再インストールを成立させてから加える。
actionlint = "latest"
pinact = "latest"
prek = "latest"
typos = "latest"

# rustはrustupのツールチェーンへのsymlinkとして導入される。symlinkで導入済みの版は
# `latest`のような曖昧な版指定の解決でmise.lockの確定バージョンより優先されるため、
# lockの版が導入されず、lock自体も導入済みの版へ書き換えられる。版を明示してこの解決経路を
# 通さない。版の更新は`make update`が`mise upgrade --bump`で行う。
# componentsを保つためinline tableではなく別テーブルで書く
# （`mise upgrade --bump`はinline tableを単一の文字列へ平坦化してoptionsを失う）。
[tools.rust]
version = "1.98.0"
components = "rustfmt,clippy"

[settings]
lockfile = true
minimum_release_age = "168h"

[tasks.bootstrap]
description = "開発環境をセットアップする"
run = [
    "env --unset=UV_FROZEN uv sync --locked --all-groups --all-extras",
    "prek install -c .pre-commit-config.yaml",
    "git config --local commit.template .gitmessage",
    "uv tool install --editable .",
]
