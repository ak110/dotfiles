# rust の `version = "latest"` の解決は、インストール済みの識別子（旧設定由来の stable など）を
# mise.lock の確定バージョンより優先して再利用する経路を持つ。この状態が残る環境では
# components が stable 側へ入る一方、RUSTUP_TOOLCHAIN には確定バージョンが設定され、
# rustfmt・clippy を実行時のツールチェーンから参照できない（CIで観測）。
# 当該対応付けを是正した上流変更を含み、配布資産を伴う最初の版を最低対応版として宣言する。
min_version = "2026.8.8"

[tools]
actionlint = "latest"
pinact = "latest"
prek = "latest"
rust = { version = "latest", components = "rustfmt,clippy" }
typos = "latest"

[settings]
lockfile = true
minimum_release_age = "168h"

[tasks.bootstrap]
description = "開発環境をセットアップする"
run = [
    "env --unset=UV_FROZEN uv sync --locked --all-groups --all-extras",
    "prek install -c .pre-commit-config.yaml",
    "git config --local commit.template .gitmessage",
    "uv tool install --editable .",
]
