[project]
name = "pytools"
version = "0.1.0"
description = "Personal command-line tools"
requires-python = ">=3.13,<4.0"
dependencies = [
    "agent-toolkit",
    "argcomplete>=3.6.3",
    "bashplotlib",
    "businesstimedelta",
    "claude-agent-sdk>=0.2.144,<0.3",
    "filelock>=3.30",
    "holidays",
    "httpx",
    "libarchive-c",
    "markdown-it-py[linkify]>=4.0.0",
    "mcp>=1.28.1,<2",
    "mdit-py-plugins>=0.6",
    "natsort",
    "numpy",
    "pdf2image",
    "pillow",
    "platformdirs>=4.0",
    "psutil",
    "pydantic>=2",
    "pygments",
    "pytilpack[quart]>=1.47.0",
    "pyyaml",
    "qrcode>=8.0",
    "semantic-version>=2.10.0",
    "send2trash",
    "tqdm",
    "wand>=0.7.0",
    "zstandard",
]

[project.scripts]
astra = "pytools.claude_launcher:main_astra"
check-image-sizes = "pytools.check_image_sizes:main"
clonedir = "pytools.clonedir:main"
dateRelocator = "pytools.date_relocator:main"
deletehomonym = "pytools.delete_homonym:main"
dirsize = "pytools.dirsize:main"
dotfiles-media-remote = "pytools.media_remote:main"
dotfiles-claude-hook = "pytools.claude_hook:main"
dotfiles-post-apply = "pytools.post_apply:main"
EcoUtilities = "pytools.ecoutilities:main"
fable = "pytools.claude_launcher:main_fable"
git-justify = "pytools.git_justify:main"
markdown-viewer = "pytools.markdown_viewer:main"
mvdir = "pytools.mvdir:main"
opus = "pytools.claude_launcher:main_opus"
psgrep = "pytools.psgrep:main"
py-imageconverter = "pytools.imageconverter:main"
py-pdf-to-image = "pytools.pdf_to_image:main"
py-rename = "pytools.rename:main"
py-rmdirs = "pytools.rmdirs:main"
randfile = "pytools.randfile:main"
regExport = "pytools.reg_export:main"
releaser = "pytools.releaser:main"
rename2hash = "pytools.rename2hash:main"
repack-archive = "pytools.repack_archive:main"
runAsAdmin = "pytools.run_as_admin:main"
sonnet = "pytools.claude_launcher:main_sonnet"
sol = "pytools.claude_launcher:main_sol"
terra = "pytools.claude_launcher:main_terra"
touch-file = "pytools.touch_file:main"
update-ssh-config = "pytools.update_ssh_config:main"

[tool.uv.sources]
agent-toolkit = { path = "agent-toolkit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# サプライチェーン攻撃対策: 公開直後の新バージョンは1日待ってから取り込む
exclude-newer = "1 day"
exclude-newer-package = { pyfltr = false, pytilpack = false }
# semgrepがmcpを完全一致でピン留めしており、単一バージョン解決の下で
# プロジェクト全体のmcpが脆弱版に固定されるため上書きする。
# 上書き後もsemgrepは1.166.0のまま維持され静的解析が正常動作することを実機で確認済み。
# mcp 2.0.0で`mcp.server.fastmcp`が削除され`mcp.server.mcpserver`へ改称されたため上限を設ける。
# 本リポジトリのMCPサーバースクリプトがmcpを直接importするため、上限なしの指定は推移依存の解決へ破壊的変更を持ち込む。
# 上限の解除条件: mcpをピン留めする上流パッケージ（現時点はsemgrep）のピンが2系を含む版へ更新され、
# その版で`uv lock`が上限なしでも解決できることを実測した時点で`<2`を外す。
override-dependencies = ["mcp>=1.28.1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["pytools"]
exclude = ["pytools/**/*_test.py", "pytools/**/*_test_helpers.py"]

[dependency-groups]
dev = [
    "filelock>=3.30",
    "hypothesis>=6.168.3",
    "jsonschema>=4.26",
    "playwright>=1.61.0",
    "pyfltr[python]>=3.20.0",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2",
    "pytest-xdist>=3.8.0",
    "types-PyYAML",
    "watchdog>=6.0.0",
]

[tool.pyfltr]
preset = "latest"
python = true
# Python 3.14はテストsuiteの実行時間が3.12/3.13に比べ25%程度長く、`command-timeout`を指定しない場合の600秒では境界を超えるためCIタイムアウトを延伸する
command-timeout = 900
ty = true
# scripts/とagent-toolkit/skills/plan-mode/scripts/のモジュールを解決するため追加する
ty-args = ["check", "--output-format", "concise", "--error-on-warning", "--extra-search-path", "scripts", "--extra-search-path", "agent-toolkit/skills/plan-mode/scripts"]
# pyfltrの設定を変えない場合は`ruff-format`が整形前に`ruff check --fix --unsafe-fixes`を実行する。
# formatter段は`--no-fix`でも`pyfltr ci`でも対象ファイルを書き換えるため、`--no-fix`だけでは
# lintの自動修正を止められない。検査だけを行う`make test`が担当範囲外のファイルを
# 書き換えないよう、`ruff-format`のlint自動修正を無効にする。
# lintの自動修正は`make format`（`uv run --frozen pyfltr fast`）のfix段が引き続き担う。
ruff-format-by-check = false
pylint-args = ["--jobs=4"]
# リポジトリ直下、agent-toolkit/およびagent-toolkit/agent_toolkit/の`conftest.py`は、いずれもトップレベルの
# モジュール`conftest`へ解決されるため、mypyが"Duplicate module named"を報告して検査全体を中断する。
# 除外指定はパスではなくファイル名で一致するため、3件の`conftest.py`をまとめてmypyの対象から外す。
# 3件ともruff・pylint・pyright・tyが引き続き検査する。
mypy-exclude = ["conftest.py"]
shellcheck = true
shfmt = true
colloquial-check = true
# agent-toolkit/はpyproject.tomlを持つためpyfltrがサブプロジェクトとして検出し、分割した検査は
# agent-toolkit/pyproject.tomlとそのcwdの設定ファイルだけを読む。agent-toolkitの独立した仮想環境に
# 依存しない検査は分割を無効にし、本ファイルと直下の設定ファイルでリポジトリ全体を1回で検査する。
# カスタムコマンドはサブプロジェクト側に定義が無いとその配下を丸ごとスキップするため、全件を対象にする。
# 分割を維持するPython系の検査の値はpyfltr_subproject_config_invariant_test.pyが両側の一致を検査する。
markdownlint-subproject-aware = false
textlint-subproject-aware = false
lychee-subproject-aware = false
sync-generated-files-subproject-aware = false
check-cmd-encoding-subproject-aware = false
check-templates-subproject-aware = false
require-ps1-bom-subproject-aware = false
powershell-analyzer-subproject-aware = false
claude-plugin-validate-subproject-aware = false
agent-doc-tone-subproject-aware = false
# rust/claude-statusline/はCargo.tomlを持つためサブプロジェクトとして検出され、スクリプトの相対パスが
# サブプロジェクト基準で解決できなくなる。判定はリポジトリ全体の履歴を使うため分割を無効にする。
statusline-version-subproject-aware = false
statusline-version = false
# 配布先で常時読み込まれる規範は、配送境界を示すXML要素で本文全体を囲む。
# この要素が先頭行と末尾行を占め、先頭行を見出しに限る規則とインラインHTMLを禁じる規則へ抵触する。
markdownlint-exclude = [
    ".chezmoi-source/dot_codex/AGENTS.md",
    ".chezmoi-source/dot_claude/rules/myprojects-common.md",
    "agent-toolkit/skills/writing-standards/references/tone-examples.md",
    "agent-toolkit/skills/writing-standards/references/tone-examples-llm-tone.md",
]
textlint-exclude = [
    ".chezmoi-source/dot_codex/AGENTS.md",
    "agent-toolkit/skills/writing-standards/references/tone-examples.md",
    "agent-toolkit/skills/writing-standards/references/tone-examples-llm-tone.md",
]
colloquial-check-exclude = [
    "agent-toolkit/skills/writing-standards/references/tone-examples.md",
    "agent-toolkit/skills/writing-standards/references/tone-examples-llm-tone.md",
]
typos-exclude = [
    "agent-toolkit/skills/writing-standards/references/tone-examples.md",
    "agent-toolkit/skills/writing-standards/references/tone-examples-llm-tone.md",
    # 規範の再構築の判定台帳。条文の先頭を40字で切った抜粋と検索語が語の途中で切れるため対象から外す。
    "docs/development/norm-restructure/*.tsv",
]
prek-exclude = [
    "agent-toolkit/skills/writing-standards/references/tone-examples.md",
    "agent-toolkit/skills/writing-standards/references/tone-examples-llm-tone.md",
]
textlint-args = ["--cache"]
lychee-exclude = [
    ".chezmoi-source/dot_codex/AGENTS.md",
    "agent-toolkit/skills/writing-standards/references/tone-examples.md",
    "agent-toolkit/skills/writing-standards/references/tone-examples-llm-tone.md",
    # ベースパスを実行時に埋めるプレースホルダーを含むため、静的なリンク解決の対象にしない。
    "agent-toolkit/agent_toolkit/_atk/serve/static/index.html",
]
# profile_ipy/はIPython自動生成プロファイルとして対象外とする。
# 対比集の除外は各コマンドで保ち、agent-doc-toneは悪い例と説明文を区別して読む。
extend-exclude = [
    "*/profile_ipy/*",
    # agent-toolkit-codex/はGit追跡の有無を問わずagent-toolkit/から生成するため、生成元と重複検査しない。
    "agent-toolkit-codex/**",
    # Antigravity CLIへ配る外部由来の規範。検査を通すための書き換えは出所の正確さを損なうため、
    # 本リポジトリの表記検査の対象から外す。
    ".chezmoi-source/dot_gemini/antigravity-cli/skills/japanese-tech-writing/SKILL.md",
]
# chezmoi命名規則（dot_*・executable_*）のshellスクリプトと、拡張子を持たないbash製CLIラッパー
# （agent-toolkit/bin/atk）をshfmtの対象に追加する
shfmt-extend-targets = ["*.sh.tmpl", "dot_bashrc", "dot_bash_profile", "executable_*", "atk"]
# 上記shfmt対象と同じファイル群をshellcheckでも検査する
shellcheck-extend-targets = ["dot_bashrc", "dot_bash_profile", "executable_*", "atk"]
textlint-packages = [
    "textlint-rule-preset-ja-technical-writing",
    "textlint-rule-preset-jtf-style",
    "textlint-rule-ja-no-abusage",
    # コーディングエージェントのコンテキスト汚染対策として独自強化する辞書を追加する
    "textlint-rule-prh",
    "textlint-rule-preset-ai-words-ja",
]
pytest-fast-targets = ["*_invariant_test.py"]

[tool.pyfltr.custom-commands.sync-generated-files]
type = "formatter"
path = "uv"
args = ["run", "--frozen", "python", "scripts/sync_generated_files.py"]
targets = [
    "AGENTS.md",
    "pyproject.toml",
    ".claude-plugin/marketplace.json",
    ".agents/plugins/marketplace.json",
    ".chezmoi-source/dot_codex/AGENTS.md",
    "agent-toolkit/.claude-plugin/plugin.json",
    "agent-toolkit/.codex-plugin/plugin.json",
    "agent-toolkit/plugin.json",
    "agent-toolkit/.mcp.json",
    "agent-toolkit/.mcp.codex.json",
    "agent-toolkit/mcp.json",
    # Codex plugin manifest生成器が入力にするskillsとshareの全階層を同期契機へ含める。
    # pyfltrのPath.matchは`**`を任意階層として扱わないため、実在する深さを明示する。
    "agent-toolkit/*.py",
    "agent-toolkit/skills/*.py",
    "agent-toolkit/rules/*.py",
    "agent-toolkit/hooks/*.py",
    "agent-toolkit/skills/*/*",
    "agent-toolkit/skills/*/*/*",
    "agent-toolkit/share/*",
    "agent-toolkit/hooks/*.json",
    "agent-toolkit/rules/*.md",
    "agent-toolkit/scripts/**/*.py",
    "agent-toolkit/agent_toolkit/**/*.py",
    "agent-toolkit/bin/*",
    "agent-toolkit/completions/atk.bash",
    "completions/_pytools.bash",
    "install-claude.sh",
    "install-claude.ps1",
    "pytools/**/*.py",
    "agent-toolkit/share/rules-main.codex.md",
    "scripts/codex_shared_rules.py",
    "scripts/gen-completions.py",
    "scripts/gen-install-files.py",
    "scripts/sync_codex_agents.py",
    "scripts/sync_codex_plugin_manifests.py",
    "scripts/sync_generated_files.py",
]
fast = true
pass-filenames = false

[tool.pyfltr.custom-commands.check-cmd-encoding]
type = "linter"
path = "scripts/check-cmd-encoding.sh"
args = ["."]
targets = ["*.cmd", "**/*.cmd"]
fast = true
pass-filenames = false

[tool.pyfltr.custom-commands.check-templates]
type = "linter"
path = "scripts/check-templates.sh"
targets = ["*.sh.tmpl", "**/*.sh.tmpl", "*.ps1.tmpl", "**/*.ps1.tmpl"]
fast = true

[tool.pyfltr.custom-commands.require-ps1-bom]
type = "linter"
path = "scripts/check-ps1-bom.sh"
targets = ["*.ps1", "**/*.ps1", "*.ps1.tmpl", "**/*.ps1.tmpl"]
fast = true

[tool.pyfltr.custom-commands.powershell-analyzer]
type = "linter"
path = "scripts/run-psscriptanalyzer.sh"
targets = ["*.ps1", "**/*.ps1"]
fast = true

[tool.pyfltr.custom-commands.claude-plugin-validate]
type = "linter"
path = "scripts/validate-claude-plugins.sh"
targets = [
    ".claude-plugin/plugin.json",
    ".claude-plugin/marketplace.json",
    "**/.claude-plugin/plugin.json",
    "**/.claude-plugin/marketplace.json",
]
fast = true

[tool.pyfltr.custom-commands.agent-doc-tone]
type = "linter"
path = "uv"
args = [
    "run", "--frozen", "python", "scripts/check_agent_doc_tone.py",
    "--term-root", "agent-toolkit",
    "--term-root", ".claude-plugin/marketplace.json",
    "--term-root", "scripts/check_agent_doc_tone.py",
    "--term-root", "scripts/check_agent_doc_tone_test.py",
]
# 終了コードに影響しない語の警告も、位置付きの診断として表示する。
error-pattern = '^(?P<file>.+?):(?P<line>\d+): (?P<message>.+)$'
targets = [
    # pyfltrのPath.matchは`**`を任意階層として扱わないため、実在する深さを明示する。
    "AGENTS.md",
    "agent-toolkit/rules/*.md",
    "agent-toolkit/share/*.md",
    "agent-toolkit/skills/*/*.md",
    "agent-toolkit/skills/*/*/*.md",
    # 説明文を置くコードにも、ファイル名を固定せずに到達させる。
    "agent-toolkit/*.py",
    "agent-toolkit/skills/*.py",
    "agent-toolkit/skills/*/*.py",
    "agent-toolkit/skills/*/references/*.py",
    "agent-toolkit/share/*.py",
    "agent-toolkit/rules/*.py",
    "agent-toolkit/hooks/*.py",
    "agent-toolkit/agent_toolkit/*.py",
    "agent-toolkit/agent_toolkit/*/*.py",
    "agent-toolkit/agent_toolkit/*/*/*.py",
    "agent-toolkit/agent_toolkit/*/*/*/*.py",
    "agent-toolkit/agent_toolkit/*/*/*/*/*.py",
    "agent-toolkit/agent_toolkit/*/*/*/*/*/*.py",
    "agent-toolkit/skills/*/scripts/*.py",
    "agent-toolkit/scripts/*.py",
    "agent-toolkit/bin/*",
    "agent-toolkit/agent_toolkit/_atk/serve/static/*.css",
    "agent-toolkit/agent_toolkit/_atk/serve/static/*.js",
    "agent-toolkit/*.toml",
    "agent-toolkit/*.json",
    "agent-toolkit/*/*.json",
    ".claude-plugin/marketplace.json",
    "scripts/check_agent_doc_tone.py",
    "scripts/check_agent_doc_tone_test.py",
    ".chezmoi-source/dot_claude/*/*.md",
    ".chezmoi-source/dot_claude/*/*/*.md",
    ".chezmoi-source/dot_claude/*/*/*/*.md",
    ".claude/skills/*/*.md",
    ".claude/skills/*/*/*.md",
    # `.agents/skills`は`.claude/skills`へのsymlinkであり、pyfltrは実体単位で重複排除して
    # 辞書順で先行する`.agents/`側のパスだけを残す。`.claude/`側だけの指定では対象が0件になる。
    ".agents/skills/*/*.md",
    ".agents/skills/*/*/*.md",
]
fast = true

[tool.pyfltr.custom-commands.statusline-version]
type = "linter"
path = "scripts/check_statusline_version.py"
pass-filenames = false
# prekのpre-commitが実行する`pyfltr fast`で版数更新前の途中commitを遮断しないよう、fastにしない。
# 終端担当が公開前のローカル検証で`--enable=statusline-version`を指定して起動する。
# pyfltrのPath.matchは`**`を任意階層として扱わないため、Git管理下にある深さを明示する。
targets = ["rust/claude-statusline/*", "rust/claude-statusline/src/*"]
fast = false

[tool.pylint."messages control"]
disable = [
    "broad-exception-caught",
    "duplicate-code",
    "fixme",
    "invalid-name",
    "line-too-long",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "no-else-return",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
]

# 既存の重複はarid-baseline.jsonで抑制し、新しい重複だけを検出する。
# 個別の`# arid: disable`と`# arid: enable`による領域抑制は使わない。
[tool.arid]
min-lines = 10
baseline = "arid-baseline.json"

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["D", "E", "F", "UP", "B", "SIM", "ICN", "I"]
ignore = ["D107", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**_test.py" = ["D"]
"**/__init__.py" = ["D104"]

[tool.pyright]
# agent-toolkitの計画補助スクリプトが同じscriptsディレクトリのモジュールを共有するため追加する。
extraPaths = ["agent-toolkit/skills/plan-mode/scripts"]

[tool.mypy]
allow_redefinition = true
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
strict_optional = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[tool.typos.default.extend-words]
# gitエイリアス名（ba = branch --all）・CSSクラス名（.pl-ba）
ba = "ba"
# filelockパッケージの実際のAPIパラメータ名（後方互換のため残置されたtypo）
intervall = "intervall"
# gitエイリアス名（aci = add-commit-in-one）
aci = "aci"
# 人名（Antony Stubbs）
Stubbs = "Stubbs"
# IPythonの正当な用語（設定項目の複数形）
configurables = "configurables"
# tmux catppuccinテーマプラグインの変数名プレフィックス（@thm_fg等）
thm = "thm"

[tool.pytest.ini_options]
addopts = [
    "--showlocals",
    "-p", "no:cacheprovider",
    "--maxfail=5",
    "--durations=30",
    "--durations-min=0.5",
    "--timeout=60",
    # コア数追従（-n auto等）を採用せず固定値とする（CI環境での逆効果とメモリ消費増を避けるため）
    "-n", "4",
    # 完了したworkerへ未実行テストを動的分配し、特定ファイルへの偏りによる律速を回避する。
    # --dist=loadfileは最大テストファイルへ実行時間が固定され律速となるため、
    # module scopeのfixtureが1件のみで順序依存が無いことを確認したうえで本方式へ変更した
    "--dist=worksteal",
]
markers = [
    "browser: Chromiumを使う実ブラウザー統合テスト",
]
log_level = "DEBUG"
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
