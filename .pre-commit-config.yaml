repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # テキストフォーマット。
      - id: trailing-whitespace
        exclude: '\.cmd$'
      - id: end-of-file-fixer
        exclude: '\.cmd$'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(cmd|ps1)(\.tmpl)?$'
      - id: fix-byte-order-marker
        # Windows PowerShell 5.1 は BOM のない .ps1 を ANSI（日本語環境では Shift-JIS）
        # として読んでしまい日本語文字列でパースエラーになる。そのため .ps1 / .ps1.tmpl の
        # BOM を保持する。
        exclude: '\.(cmd|ps1)(\.tmpl)?$'
      # シンタックス検証。
      - id: check-yaml
        exclude: '\.tmpl$'
      - id: check-json
        exclude: '(^|/)modify_|environment\.json$'
      - id: check-toml
        exclude: '(^|/)modify_|\.tmpl$'
      - id: check-ast
      # セキュリティ。
      - id: detect-private-key
      # ファイル検証。
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: '\.tmpl$'
      - id: check-symlinks
      - id: check-merge-conflict
      - id: check-case-conflict
      # Python。
      - id: debug-statements

  - repo: local
    hooks:
      - id: pyfltr
        name: pyfltr
        entry: uvx pyfltr fast
        always_run: true
        require_serial: true
        language: system
      - id: check-script-imports
        name: check-script-imports
        entry: uv run --no-project --script scripts/check_script_imports.py
        language: system
        pass_filenames: false
        always_run: true
      # pyfltr 3.14.1はCargoサブプロジェクトを指定してもリポジトリルートで実行し、
      # cargo metadataの失敗を成功扱いするため、Rust検査は作業ディレクトリを指定して直接実行する。
      - id: cargo-fmt
        name: cargo fmt --check
        entry: bash -c 'cd rust/claude-statusline && cargo fmt --check'
        language: system
        pass_filenames: false
        files: '^rust/claude-statusline/.*\.(rs|toml)$'
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd rust/claude-statusline && cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        files: '^rust/claude-statusline/.*\.(rs|toml)$'
      # コミット時にローカルへも反映する（適用漏れ防止のため）。
      - id: chezmoi-apply
        name: chezmoi apply
        entry: bash -c '[ "$(git rev-parse --show-toplevel)" != "$HOME/dotfiles" ] || chezmoi apply'
        require_serial: true
        pass_filenames: false
        language: system
