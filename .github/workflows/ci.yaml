name: CI
on:
  push:
    tags-ignore:
      - '*'
    branches:
      - '**'
  pull_request:
    branches:
      - master
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  common-ci-owner:
    name: common-ci-owner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      owns: ${{ steps.owner.outputs.owns }}
      reason: ${{ steps.owner.outputs.reason }}
      rust: ${{ steps.scope.outputs.rust }}
      browser: ${{ steps.scope.outputs.browser }}
      scope_reason: ${{ steps.scope.outputs.scope_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
      - name: 共通CI所有の判定
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.base_ref == 'master'
            }}
        shell: bash
        run: python3 scripts/ci_owner.py
      - name: 変更領域の判定
        id: scope
        if: steps.owner.outputs.owns == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: python3 scripts/ci_scope.py
  test-linux:
    needs: common-ci-owner
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && 'test-linux (non-owner)' || 'test-linux' }}
    runs-on: ubuntu-latest
    steps:
      - name: 共通CI非所有経路
        if: needs.common-ci-owner.outputs.owns == 'false'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
        run: echo "$OWNER_REASON"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.common-ci-owner.outputs.owns == 'true'
        with:
          fetch-depth: 0
          path: dotfiles
      - uses: ./dotfiles/.github/actions/ci-test-linux
        if: needs.common-ci-owner.outputs.owns == 'true'
  update-dotfiles-upgrade-windows:
    needs: common-ci-owner
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && 'update-dotfiles-upgrade (windows) (non-owner)' || 'update-dotfiles-upgrade (windows)' }}
    runs-on: windows-latest
    steps:
      - name: 共通CI非所有経路
        if: needs.common-ci-owner.outputs.owns == 'false'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
        run: Write-Output "$env:OWNER_REASON"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.common-ci-owner.outputs.owns == 'true'
        with:
          fetch-depth: 0
          path: dotfiles
      - uses: ./dotfiles/.github/actions/ci-update-dotfiles-upgrade-windows
        if: needs.common-ci-owner.outputs.owns == 'true'
  test-windows:
    needs: common-ci-owner
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && 'test-windows (non-owner)' || 'test-windows' }}
    runs-on: windows-latest
    steps:
      - name: 共通CI非所有経路
        if: needs.common-ci-owner.outputs.owns == 'false'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
        run: Write-Output "$env:OWNER_REASON"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.common-ci-owner.outputs.owns == 'true'
        with:
          fetch-depth: 0
          path: dotfiles
      - uses: ./dotfiles/.github/actions/ci-test-windows
        if: needs.common-ci-owner.outputs.owns == 'true'
  browser-e2e:
    needs: common-ci-owner
    if: ${{ !cancelled() }}
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && 'browser-e2e (non-owner)' || 'browser-e2e' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      PYTHONDEVMODE: '1'
      UV_FROZEN: '1'
      UV_PYTHON: '3.15'
    steps:
      - name: 共通CI非所有経路
        if: needs.common-ci-owner.outputs.owns == 'false'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
        run: echo "$OWNER_REASON"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 検査領域の判定を確認
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          OWNS: ${{ needs.common-ci-owner.outputs.owns }}
          OWNER_RESULT: ${{ needs.common-ci-owner.result }}
          SELECTED: ${{ needs.common-ci-owner.outputs.browser }}
          SCOPE_REASON: ${{ needs.common-ci-owner.outputs.scope_reason }}
          CHECK_NAME: browser-e2e
        run: bash scripts/ci_check_scope.sh
        id: selection
      - uses: ./.github/actions/ci-browser-e2e
        if: steps.selection.outputs.selected == 'true'
  rust-lint:
    needs: common-ci-owner
    if: ${{ !cancelled() }}
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && 'rust-lint (non-owner)' || 'rust-lint' }}
    runs-on: ubuntu-latest
    steps:
      - name: 共通CI非所有経路
        if: needs.common-ci-owner.outputs.owns == 'false'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
        run: echo "$OWNER_REASON"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 検査領域の判定を確認
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          OWNS: ${{ needs.common-ci-owner.outputs.owns }}
          OWNER_RESULT: ${{ needs.common-ci-owner.result }}
          SELECTED: ${{ needs.common-ci-owner.outputs.rust }}
          SCOPE_REASON: ${{ needs.common-ci-owner.outputs.scope_reason }}
          CHECK_NAME: rust-lint
        run: bash scripts/ci_check_scope.sh
        id: selection
      - uses: ./.github/actions/ci-rust-lint
        if: steps.selection.outputs.selected == 'true'
  statusline-version:
    name: statusline-version
    if: (github.event_name == 'pull_request' && github.base_ref == 'master') || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: statuslineの版数とタグを検査
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: python3 scripts/check_statusline_version.py
  plugin-version:
    name: plugin-version
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
      - name: 配布プラグインの版数据置きを検査
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: python3 scripts/check_plugin_version.py
  python-lint:
    needs: common-ci-owner
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && 'python-lint-other (3.15) (non-owner)' || 'python-lint-other (3.15)' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      PYTHONDEVMODE: '1'
      UV_FROZEN: '1'
      UV_PYTHON: '3.15'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 共通CI非所有経路
        if: needs.common-ci-owner.outputs.owns == 'false'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
        run: echo "$OWNER_REASON"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.common-ci-owner.outputs.owns == 'true'
      - name: ユーザー設定から隔離したlockfile検証
        if: needs.common-ci-owner.outputs.owns == 'true'
        run: |
          set -euo pipefail
          config_dir="$(mktemp -d)"
          trap 'rm -r -- "$config_dir"' EXIT
          env --unset=UV_FROZEN XDG_CONFIG_HOME="$config_dir" uv lock --check
      - uses: ./.github/actions/prepare-python-check
        with:
          cache-key: python-lint
          native: 'true'
        if: needs.common-ci-owner.outputs.owns == 'true'
      - name: Python 3.15 pytest以外の検査
        if: needs.common-ci-owner.outputs.owns == 'true'
        env:
          SKIP: cargo-fmt,cargo-clippy
        run: pyfltr ci --disable=pylint,pytest,claude-plugin-validate,statusline-version,plugin-version,function-hooks-types
      - name: Prune uv cache for CI
        if: needs.common-ci-owner.outputs.owns == 'true'
        run: uv cache prune --ci
  pylint:
    needs: common-ci-owner
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && 'pylint (3.15) (non-owner)' || 'pylint (3.15)' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      PYTHONDEVMODE: '1'
      UV_FROZEN: '1'
      UV_PYTHON: '3.15'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 共通CI非所有経路
        if: needs.common-ci-owner.outputs.owns == 'false'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
        run: echo "$OWNER_REASON"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.common-ci-owner.outputs.owns == 'true'
      - uses: ./.github/actions/prepare-python-check
        with:
          cache-key: pylint
          native: 'false'
        if: needs.common-ci-owner.outputs.owns == 'true'
      - name: Python 3.15 Pylint
        if: needs.common-ci-owner.outputs.owns == 'true'
        run: pyfltr ci --commands=pylint
      - name: Prune uv cache for CI
        if: needs.common-ci-owner.outputs.owns == 'true'
        run: uv cache prune --ci
  pytest-root:
    needs: common-ci-owner
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && 'pytest (3.15) (non-owner)' || 'pytest (3.15)' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      PYTHONDEVMODE: '1'
      UV_FROZEN: '1'
      UV_PYTHON: '3.15'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 共通CI非所有経路
        if: needs.common-ci-owner.outputs.owns == 'false'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
        run: echo "$OWNER_REASON"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.common-ci-owner.outputs.owns == 'true'
      - uses: ./.github/actions/prepare-python-check
        with:
          cache-key: pytest-root
          native: 'true'
        if: needs.common-ci-owner.outputs.owns == 'true'
      - uses: ./.github/actions/minimum-git
        id: minimum-git
        if: needs.common-ci-owner.outputs.owns == 'true'
      - name: Python 3.15 pytest 直下
        if: needs.common-ci-owner.outputs.owns == 'true'
        env:
          AGENT_TOOLKIT_TEST_GIT: ${{ steps.minimum-git.outputs.git }}
        run: |
          set -euo pipefail
          git ls-files -z -- '*_test.py' 'test_*.py' \
            ':!:agent-toolkit/**' ':!:agent-toolkit-codex/**' \
            > "$RUNNER_TEMP/pytest-root-targets"
          mapfile -d '' -t targets < "$RUNNER_TEMP/pytest-root-targets"
          test "${#targets[@]}" -gt 0
          uv run --frozen pytest -v --maxfail=0 "${targets[@]}"
      - name: Prune uv cache for CI
        if: needs.common-ci-owner.outputs.owns == 'true'
        run: uv cache prune --ci
  pytest-toolkit:
    needs: common-ci-owner
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && format('pytest-toolkit (3.15, {0}) (non-owner)', matrix.shard) || format('pytest-toolkit (3.15, {0})', matrix.shard) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      PYTHONDEVMODE: '1'
      UV_FROZEN: '1'
      UV_PYTHON: '3.15'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 共通CI非所有経路
        if: needs.common-ci-owner.outputs.owns == 'false'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
        run: echo "$OWNER_REASON"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.common-ci-owner.outputs.owns == 'true'
      - uses: ./.github/actions/prepare-python-check
        with:
          cache-key: pytest-toolkit-${{ strategy.job-index }}
          native: 'true'
        if: needs.common-ci-owner.outputs.owns == 'true'
      - uses: ./.github/actions/minimum-git
        id: minimum-git
        if: needs.common-ci-owner.outputs.owns == 'true'
      - name: Python 3.15 pytest toolkit
        if: needs.common-ci-owner.outputs.owns == 'true'
        env:
          AGENT_TOOLKIT_TEST_GIT: ${{ steps.minimum-git.outputs.git }}
          TEST_SHARD: ${{ matrix.shard }}
        run: pyfltr ci --work-dir agent-toolkit --commands=pytest --pytest-args="-v --maxfail=0 --test-shard=$TEST_SHARD" agent-toolkit
      - name: Prune uv cache for CI
        if: needs.common-ci-owner.outputs.owns == 'true'
        run: uv cache prune --ci
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/3
          - 2/3
          - 3/3
  pytest-toolkit-result:
    needs:
      - common-ci-owner
      - pytest-toolkit
    if: ${{ !cancelled() }}
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && 'pytest-toolkit (3.15) (non-owner)' || 'pytest-toolkit (3.15)' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 必須checkの全実行結果確認
        env:
          OWNS: ${{ needs.common-ci-owner.outputs.owns }}
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: python3 scripts/ci_result.py
  python-lint-result:
    needs:
      - common-ci-owner
      - python-lint
      - pylint
    if: ${{ !cancelled() }}
    name: ${{ needs.common-ci-owner.outputs.owns == 'false' && 'python-lint (3.15) (non-owner)' || 'python-lint (3.15)' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 必須checkの全実行結果確認
        env:
          OWNS: ${{ needs.common-ci-owner.outputs.owns }}
          OWNER_REASON: ${{ needs.common-ci-owner.outputs.reason }}
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: python3 scripts/ci_result.py
