name: CI
on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.base_ref == 'master' && 'test-linux (non-owner)' || 'test-linux' }}
    runs-on: ubuntu-latest
    steps:
      - name: 共通CI非所有経路
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.base_ref == 'master'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: echo "developからmasterへのrelease pull requestではdevelop pushが共通CIを所有する。"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        with:
          fetch-depth: 0
          path: dotfiles
      - name: ~/dotfiles に配置
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: |
          mv dotfiles ~/dotfiles
          echo "DOTFILES_DIR=$HOME/dotfiles" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        with:
          working-directory: ${{ env.DOTFILES_DIR }}
      - name: PowerShell + PSScriptAnalyzer インストール
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: make -C "$HOME/dotfiles" setup-pwsh
      - name: chezmoi インストール
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: |
          set -euo pipefail
          install_chezmoi() {
            local attempt=1
            local installer
            until installer=$(curl -fsSL --connect-timeout 10 --max-time 30 get.chezmoi.io) &&
              sh -c "$installer" -- -b "$HOME/.local/bin"; do
              if [ "$attempt" -ge 3 ]; then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
          }
          install_chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install.sh 実行
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: ~/dotfiles/install.sh
      - name: 主要ファイルの存在確認
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: |
          set -euo pipefail
          test -f ~/.bashrc
          test -f ~/.vimrc
          test -f ~/.claude/rules/agent-toolkit/01-agent.md
          test -f ~/.ssh/config
          # shellcheck disable=SC2016 # .bashrc内に格納される$HOMEをシェル変数ではなく文字列リテラルとして検索する
          grep -qF '$HOME/dotfiles/bin' ~/.bashrc

  test-windows:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.base_ref == 'master' && 'test-windows (non-owner)' || 'test-windows' }}
    runs-on: windows-latest
    steps:
      - name: 共通CI非所有経路
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.base_ref == 'master'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: Write-Output "developからmasterへのrelease pull requestではdevelop pushが共通CIを所有する。"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        with:
          fetch-depth: 0
          path: dotfiles
      - name: ~/dotfiles に配置
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        # Windows runnerはチェックアウト先（D:）と $env:USERPROFILE（C:）が別ボリュームのため、
        # GNU mvでクロスドライブ移動するとシンボリックリンクの再作成に失敗する。
        # robocopyの /SL でsymlinkを保持しつつコピーし、元ディレクトリを削除して移動を実現する。
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\dotfiles"
          $dst = "$env:USERPROFILE\dotfiles"
          robocopy $src $dst /E /SL /COPY:DAT /NFL /NDL /NJH /NJS
          $rc = $LASTEXITCODE
          if ($rc -ge 8) { exit $rc }
          Remove-Item -Recurse -Force $src
          "DOTFILES_DIR=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        with:
          working-directory: ${{ env.DOTFILES_DIR }}
      - name: managed-temp Windows境界テスト
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        shell: pwsh
        working-directory: ${{ env.DOTFILES_DIR }}
        run: >-
          uv run --python 3.14 pytest -q
          agent-toolkit/scripts/_managed_temp_test.py
          agent-toolkit/scripts/permissionrequest_codex_test.py
      - name: chezmoi インストール
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        shell: bash
        run: |
          set -euo pipefail
          install_chezmoi() {
            local attempt=1
            local installer
            until installer=$(curl -fsSL --connect-timeout 10 --max-time 30 get.chezmoi.io) &&
              sh -c "$installer" -- -b "$HOME/.local/bin"; do
              if [ "$attempt" -ge 3 ]; then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
          }
          install_chezmoi
      - name: chezmoi 適用
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi init --source=~/dotfiles --apply
      - name: dotfiles-post-apply の動作確認
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        shell: pwsh
        run: dotfiles-post-apply
      - name: 主要ファイルの存在確認
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:USERPROFILE\.claude\rules\agent-toolkit\01-agent.md")) { exit 1 }
          if (-not (Test-Path "$env:USERPROFILE\.ssh\authorized_keys")) { exit 1 }
          $envKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          if ($null -eq $envKey) { exit 1 }
          try {
            $pathValue = $envKey.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $pathKind = $envKey.GetValueKind('Path')
          } finally {
            $envKey.Close()
          }
          if ($pathValue -notlike '*%USERPROFILE%\dotfiles\bin*') { exit 1 }
          if ($pathKind -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) { exit 1 }

  python-lint:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.base_ref == 'master' && format('python-lint ({0}) (non-owner)', matrix.python-version) || format('python-lint ({0})', matrix.python-version) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
      # repack-archive の PDF 入力テストで pdftoppm を使うため、apt 導入用に root で実行する
      # （既定ユーザーは非 root・sudo 無し）
      options: --user root
    defaults:
      run:
        shell: bash
    strategy:
      # 1つの版が失敗しても他の版の結果を取得し、失敗が版固有かを切り分けられるようにする
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # 開発モード: DeprecationWarning などの隠れた問題を早期検出する
      PYTHONDEVMODE: "1"
      # サプライチェーン攻撃対策: uv が lockfile を常に尊重する
      UV_FROZEN: "1"
      UV_PYTHON: ${{ matrix.python-version }}
      # mise・pinact 等が GitHub API を呼び出す際のレート制限（403）回避。
      # container job では明示しないと secrets.GITHUB_TOKEN がコンテナへ渡らない
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 共通CI非所有経路
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.base_ref == 'master'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: echo "developからmasterへのrelease pull requestではdevelop pushが共通CIを所有する。"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
      - name: 利用者設定から隔離したlockfile検証
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master') && matrix.python-version == '3.14'
        run: |
          set -euo pipefail
          config_dir="$(mktemp -d)"
          trap 'rm -r -- "$config_dir"' EXIT
          env --unset=UV_FROZEN XDG_CONFIG_HOME="$config_dir" uv lock --check
      - name: safe.directory の設定
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        # --user root 実行のためワークスペース所有者（UID 1001）と実行ユーザーが不一致になり、
        # pre-commit 等の git 操作が dubious ownership で停止する。safe.directory へ追加して回避する。
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: GitHub Actions のピン留め検証
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: pinact run --check

      - name: ネイティブ依存インストール
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        # actions/cacheはPATH上のzstdを使ってキャッシュを圧縮するため、キャッシュの復元より前に導入する。
        # repack-archive の PDF 入力テストが pdftoppm を、libarchive-c 経由のアーカイブ展開が
        # libarchive13 の共有ライブラリを必要とする。
        # make は container image に含まれないため、後続ステップの make setup-browser 用に導入する
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends poppler-utils libarchive13 make zstd

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        with:
          path: /cache
          # 固定キーでは一度保存されると更新されないため、run_idとrun_attemptを含めて毎回保存させる。
          # restore-keysで直近のキャッシュを初期値として復元し、ジョブ中に変化した/cacheの内容を
          # 新しいキーで保存して次の実行へ引き継ぐ。
          # run_idは再実行（Re-run）で変化しないため、run_attemptを併記する。
          # run_idだけでは再実行時にキーが完全一致し、当該再実行中に変化した/cacheの内容が保存されない。
          key: pyfltr-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pyfltr-cache-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: uv sync --all-groups --all-extras

      - name: Playwright Chromiumの導入
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master') && matrix.python-version == '3.14'
        run: make setup-browser

      - name: Python 3.13 pytest
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master') && matrix.python-version == '3.13'
        run: pyfltr ci --commands=pytest

      - name: Python 3.14全検査
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master') && matrix.python-version == '3.14'
        env:
          # cargo-fmt/cargo-clippy はrust-lint jobで専用実行するため python-lint 側では
          # 除外する（ccを含むRustビルドツールチェーンをcontainer imageに追加せずに済む）
          SKIP: cargo-fmt,cargo-clippy
        # claude CLIのCI導入はminimum-release-age機構とメタデータ欠落で安定しないため、
        # Claude plugin manifest検査だけを無効化する。
        run: pyfltr ci --disable=claude-plugin-validate

      - name: Python 3.14 E2E
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master') && matrix.python-version == '3.14'
        env:
          CLAUDE_PLANS_VIEWER_BROWSER_TESTS: "1"
          AGENT_TOOLKIT_SERVE_BROWSER_TESTS: "1"
        run: >-
          uv run pytest
          agent-toolkit/scripts/_atk_serve_browser_test.py
          pytools/claude_plans_viewer_browser_test.py
          -o addopts='' -p no:cacheprovider

      - name: Prune uv cache for CI
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: uv cache prune --ci

  rust-lint:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.base_ref == 'master' && 'rust-lint (non-owner)' || 'rust-lint' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/claude-statusline
    steps:
      - name: 共通CI非所有経路
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'develop' && github.base_ref == 'master'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: echo "developからmasterへのrelease pull requestではdevelop pushが共通CIを所有する。"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        with:
          workspaces: rust/claude-statusline
      - name: cargo fmt --check
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: cargo fmt --check
      - name: cargo clippy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'develop' || github.base_ref != 'master'
        run: cargo test

  statusline-version:
    name: statusline-version
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: statuslineの版数とタグを検査
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if git diff --quiet "$BASE_SHA" "$CURRENT_SHA" -- rust/claude-statusline/; then
            echo "statuslineの変更がないため、版数検査を省略する。"
            exit 0
          fi

          read_version() {
            python3 - "$1" <<'PY'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as stream:
              print(tomllib.load(stream)["package"]["version"])
          PY
          }

          base_manifest=$(mktemp)
          trap 'rm -f -- "$base_manifest"' EXIT
          git show "$BASE_SHA:rust/claude-statusline/Cargo.toml" > "$base_manifest"
          base_version=$(read_version "$base_manifest")
          current_version=$(read_version rust/claude-statusline/Cargo.toml)

          if [ "$base_version" = "$current_version" ]; then
            echo "statuslineの変更にはCargo.tomlの版数更新が必要である。" >&2
            exit 1
          fi

          mise exec -- cargo metadata \
            --locked \
            --no-deps \
            --format-version=1 \
            --manifest-path rust/claude-statusline/Cargo.toml \
            >/dev/null

          tag="statusline-v$current_version"
          tag_status=0
          git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1 || tag_status=$?
          case "$tag_status" in
            0)
              echo "statuslineの版数に対応する既存タグがある: $tag" >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "statuslineのタグ照会に失敗した: $tag" >&2
              exit "$tag_status"
              ;;
          esac
