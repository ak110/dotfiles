name: Release statusLine

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-statusline
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      eligible: ${{ steps.validate.outputs.eligible }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
    steps:
      - name: upstream CIの入力を検証
        id: validate
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          eligible=false
          if [ "$EVENT" = "push" ] &&
            [ "$CONCLUSION" = "success" ] &&
            [ "$HEAD_BRANCH" = "master" ] &&
            [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            eligible=true
          fi

          {
            echo "eligible=$eligible"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          if [ "$eligible" != "true" ]; then
            echo "対象repositoryのmasterへの成功したpush以外のため、リリースを省略する。"
          fi

  prepare:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.inspect.outputs.changed }}
      version: ${{ steps.inspect.outputs.version }}
      tag: ${{ steps.inspect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: statusline差分と版数を検査
        id: inspect
        env:
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          set -euo pipefail

          parent_sha=$(git rev-parse "$HEAD_SHA^1")
          if git diff --quiet "$parent_sha" "$HEAD_SHA" -- rust/claude-statusline/; then
            {
              echo "changed=false"
              echo "version="
              echo "tag="
            } >> "$GITHUB_OUTPUT"
            echo "statuslineの変更がないため、リリースを省略する。"
            exit 0
          fi

          metadata=$(mise exec -- cargo metadata \
            --locked \
            --no-deps \
            --format-version=1 \
            --manifest-path rust/claude-statusline/Cargo.toml)
          version=$(jq -er '[.packages[] | select(.name == "claude-statusline") | .version] | if length == 1 then .[0] else error("claude-statuslineのpackage版数を一意に取得できない") end' <<< "$metadata")
          tag="statusline-v$version"

          tagged_sha=$(git rev-parse --verify --quiet "$tag^{}" || true)
          if [ -n "$tagged_sha" ] && [ "$tagged_sha" != "$HEAD_SHA" ]; then
            echo "既存タグが別のcommitを指している: $tag" >&2
            exit 1
          fi

          {
            echo "changed=true"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [gate, prepare]
    if: needs.gate.outputs.eligible == 'true' && needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: claude-statusline-x86_64-unknown-linux-gnu
          - os: windows-latest
            asset: claude-statusline-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust/claude-statusline
      - name: ビルド
        run: mise exec -- cargo build --release --locked --manifest-path rust/claude-statusline/Cargo.toml
      - name: バイナリを配置 (POSIX)
        if: runner.os != 'Windows'
        run: cp rust/claude-statusline/target/release/claude-statusline "${{ matrix.asset }}"
      - name: バイナリを配置 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item rust/claude-statusline/target/release/claude-statusline.exe "${{ matrix.asset }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [gate, prepare, build]
    if: needs.gate.outputs.eligible == 'true' && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: タグとGitHub Releaseを公開
        run: |
          set -euo pipefail

          tag="$TAG"
          git fetch --tags origin
          tagged_sha=$(git rev-parse --verify --quiet "$tag^{}" || true)
          if [ -n "$tagged_sha" ]; then
            if [ "$tagged_sha" != "$HEAD_SHA" ]; then
              echo "既存タグが別のcommitを指している: $tag" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "$HEAD_SHA"
            git push origin "refs/tags/$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              assets/claude-statusline-x86_64-unknown-linux-gnu \
              assets/claude-statusline-x86_64-pc-windows-msvc.exe \
              --clobber
          else
            gh release create "$tag" \
              assets/claude-statusline-x86_64-unknown-linux-gnu \
              assets/claude-statusline-x86_64-pc-windows-msvc.exe \
              --title="$tag" \
              --notes="claude-statusline v${tag#statusline-v}をリリースする"
          fi
