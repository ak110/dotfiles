name: Release statusLine

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-statusline
  queue: max

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      eligible: ${{ steps.validate.outputs.eligible }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
    steps:
      - name: upstream CIの入力を検証
        id: validate
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          eligible=false
          if [ "$EVENT" = "push" ] &&
            [ "$CONCLUSION" = "success" ] &&
            [ "$HEAD_BRANCH" = "master" ] &&
            [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            eligible=true
          fi

          {
            echo "eligible=$eligible"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          if [ "$eligible" != "true" ]; then
            echo "対象repositoryのmasterへの成功したpush以外のため、リリースを省略する。"
            echo "対応不要: リリース対象の条件を満たす次のCI成功時に検査する。"
          fi

  prepare:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.inspect.outputs.changed }}
      version: ${{ steps.inspect.outputs.version }}
      tag: ${{ steps.inspect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: statusline差分と版数を検査
        id: inspect
        env:
          CURRENT_SHA: ${{ needs.gate.outputs.head_sha }}
        run: uv run --no-project --python 3.15 --script scripts/check_statusline_version.py --release-prepare --github-output "$GITHUB_OUTPUT"

  release:
    needs: [gate, prepare]
    if: needs.gate.outputs.eligible == 'true' && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: statusline-release-*
          path: assets
          merge-multiple: true
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: 既存タグを検査
        id: tag-state
        env:
          CURRENT_SHA: ${{ needs.gate.outputs.head_sha }}
        run: uv run --no-project --python 3.15 --script scripts/check_statusline_version.py --release-tag-state --github-output "$GITHUB_OUTPUT"
      - name: タグとGitHub Releaseを公開
        env:
          TAG_EXISTS: ${{ steps.tag-state.outputs.tag_exists }}
        run: |
          set -euo pipefail

          tag="$TAG"
          assets=(
            assets/claude-statusline-x86_64-unknown-linux-gnu
            assets/claude-statusline-x86_64-pc-windows-msvc.exe
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "先行CIに署名済み配布物がない: $asset" >&2
              exit 1
            fi
          done
          heading='## ビルド来歴の検証'
          verification=$(printf '%s\n\n' "$heading"; cat <<'EOF'
          GitHub CLIを `gh auth login` または `GH_TOKEN` で認証し、ダウンロードしたバイナリを検証する。

          ```bash
          gh attestation verify claude-statusline-x86_64-unknown-linux-gnu --repo ak110/dotfiles \
            --signer-workflow ak110/dotfiles/.github/workflows/ci.yaml
          ```

          Windowsではファイル名を `claude-statusline-x86_64-pc-windows-msvc.exe` に置き換える。
          証明のソースコミットはこのReleaseのタグが指すコミットと一致する。
          タグとの一致も検査するには、タグが指すコミットのSHAを `--source-digest` に渡す。
          [証明一覧](https://github.com/ak110/dotfiles/attestations)
          EOF
          )

          release_exists=false
          if body=$(gh release view "$tag" --json body --jq .body 2>/dev/null); then
            release_exists=true
          else
            latest=false
            query="query(\$owner: String!, \$name: String!) { repository(owner: \$owner, name: \$name) { latestRelease { tagName } } }"
            latest_response=$(gh api graphql \
              -f query="$query" \
              -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}")
            latest_tag=$(jq -er '.data.repository | if . == null then error("repository missing") else .latestRelease.tagName // "" end' \
              <<< "$latest_response")
            stable_tag='^statusline-v[0-9]+\.[0-9]+\.[0-9]+$'
            if [[ "$tag" =~ $stable_tag ]]; then
              if [[ -z "$latest_tag" ]]; then
                latest=true
              elif [[ "$latest_tag" =~ $stable_tag && "$tag" != "$latest_tag" ]]; then
                newest=$(printf '%s\n' "$latest_tag" "$tag" | LC_ALL=C sort -V | tail -n 1)
                if [[ "$newest" == "$tag" ]]; then
                  latest=true
                fi
              fi
            fi
          fi

          if [ "$TAG_EXISTS" != "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "$HEAD_SHA"
            git push origin "refs/tags/$tag"
          fi

          if [ "$release_exists" = "true" ]; then
            gh release upload "$tag" "${assets[@]}" --clobber
            if [[ "$body" != *"$heading"* ]]; then
              notes=$(printf '%s\n\n%s' "$body" "$verification")
              gh release edit "$tag" --notes "$notes"
            fi
          else
            notes=$(printf 'claude-statusline v%sをリリースする。\n\n%s' "${tag#statusline-v}" "$verification")
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --latest="$latest" \
              --title="$tag" \
              --notes="$notes"
          fi
