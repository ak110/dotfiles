name: Release statusLine

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-statusline
  queue: max

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      eligible: ${{ steps.validate.outputs.eligible }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
    steps:
      - name: upstream CIの入力を検証
        id: validate
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          eligible=false
          if [ "$EVENT" = "push" ] &&
            [ "$CONCLUSION" = "success" ] &&
            [ "$HEAD_BRANCH" = "master" ] &&
            [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            eligible=true
          fi

          {
            echo "eligible=$eligible"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          if [ "$eligible" != "true" ]; then
            echo "対象repositoryのmasterへの成功したpush以外のため、リリースを省略する。"
            echo "対応不要: リリース対象の条件を満たす次のCI成功時に検査する。"
          fi

  prepare:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.inspect.outputs.changed }}
      version: ${{ steps.inspect.outputs.version }}
      tag: ${{ steps.inspect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: statusline差分と版数を検査
        id: inspect
        env:
          CURRENT_SHA: ${{ needs.gate.outputs.head_sha }}
        run: uv run --no-project --python 3.15 --script scripts/check_statusline_version.py --release-prepare --github-output "$GITHUB_OUTPUT"

  build:
    needs: [gate, prepare]
    if: needs.gate.outputs.eligible == 'true' && needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: claude-statusline-x86_64-unknown-linux-gnu
          - os: windows-latest
            asset: claude-statusline-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/claude-statusline
      - name: ビルド
        run: mise exec -- cargo build --release --locked --manifest-path rust/claude-statusline/Cargo.toml
      - name: バイナリを配置 (POSIX)
        if: runner.os != 'Windows'
        run: cp rust/claude-statusline/target/release/claude-statusline "${{ matrix.asset }}"
      - name: バイナリを配置 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item rust/claude-statusline/target/release/claude-statusline.exe "${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [gate, prepare, build]
    if: needs.gate.outputs.eligible == 'true' && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: 既存タグを検査
        id: tag-state
        env:
          CURRENT_SHA: ${{ needs.gate.outputs.head_sha }}
        run: uv run --no-project --python 3.15 --script scripts/check_statusline_version.py --release-tag-state --github-output "$GITHUB_OUTPUT"
      - name: タグとGitHub Releaseを公開
        env:
          TAG_EXISTS: ${{ steps.tag-state.outputs.tag_exists }}
        run: |
          set -euo pipefail

          tag="$TAG"
          release_exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            release_exists=true
          else
            latest=false
            query="query(\$owner: String!, \$name: String!) { repository(owner: \$owner, name: \$name) { latestRelease { tagName } } }"
            latest_response=$(gh api graphql \
              -f query="$query" \
              -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}")
            latest_tag=$(jq -er '.data.repository | if . == null then error("repository missing") else .latestRelease.tagName // "" end' \
              <<< "$latest_response")
            stable_tag='^statusline-v[0-9]+\.[0-9]+\.[0-9]+$'
            if [[ "$tag" =~ $stable_tag ]]; then
              if [[ -z "$latest_tag" ]]; then
                latest=true
              elif [[ "$latest_tag" =~ $stable_tag && "$tag" != "$latest_tag" ]]; then
                newest=$(printf '%s\n' "$latest_tag" "$tag" | LC_ALL=C sort -V | tail -n 1)
                if [[ "$newest" == "$tag" ]]; then
                  latest=true
                fi
              fi
            fi
          fi

          if [ "$TAG_EXISTS" != "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "$HEAD_SHA"
            git push origin "refs/tags/$tag"
          fi

          if [ "$release_exists" = "true" ]; then
            gh release upload "$tag" \
              assets/claude-statusline-x86_64-unknown-linux-gnu \
              assets/claude-statusline-x86_64-pc-windows-msvc.exe \
              --clobber
          else
            gh release create "$tag" \
              assets/claude-statusline-x86_64-unknown-linux-gnu \
              assets/claude-statusline-x86_64-pc-windows-msvc.exe \
              --verify-tag \
              --latest="$latest" \
              --title="$tag" \
              --notes="claude-statusline v${tag#statusline-v}をリリースする"
          fi
