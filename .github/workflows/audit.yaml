name: Audit

# Python・Rust依存の脆弱性監査を定期実行する。監査は外部脆弱性データベースへ
# 問い合わせるため結果がコード変更と無関係に変動する。push/PR毎のCIには載せず、
# スケジュール実行と手動実行に限定する。
# Pythonの検出はSARIF形式でCode Scanningへ送り、同一脆弱性を集約・解消時にクローズする。
# Rustの検出とツール異常はジョブの失敗とログに残す。
on:
  schedule:
    # 毎日 06:00 UTC（JST 15:00）に実行する。
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  # 開発モード: DeprecationWarningなどの隠れた問題を早期検出する
  PYTHONDEVMODE: "1"
  # サプライチェーン攻撃対策: uvがlockfileを尊重する
  UV_FROZEN: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
    defaults:
      run:
        shell: bash
    env:
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Run dependency audit
        # uv-auditはネットワーク必須で結果が変動するため、pyproject.tomlでは有効化していない。
        # この定期ジョブだけで有効化するため、一時グローバル設定をPYFLTR_GLOBAL_CONFIGで読ませる。
        # load_configはproject未指定キーにglobal値を残すため、uv-auditがtrueになる。
        # severity未指定（error）で、脆弱性検出時はexit 1を返す。
        # Python依存はuv-audit、Rust依存は後続のcargo-auditで監査する。
        # SARIF出力をファイルへ保存し、後続ステップでCode Scanningへアップロードする。
        run: |
          set -euo pipefail
          audit_config="${RUNNER_TEMP}/pyfltr-audit-config.toml"
          printf '[tool.pyfltr]\nuv-audit = true\n' > "${audit_config}"
          # 脆弱性検出時はpyfltrがexit 1を返す。後続ステップへ到達させるため終了コードを保持する。
          audit_rc=0
          PYFLTR_GLOBAL_CONFIG="${audit_config}" uv run pyfltr ci --commands=uv-audit --output-format=sarif \
            > "${RUNNER_TEMP}/audit.sarif" || audit_rc=$?
          # SARIFにuv-auditのrunが含まれることを検証する。
          # 設定読み込み失敗等でuv-auditが無言スキップされた場合はrunが存在しない。
          if ! jq -e '.runs[] | select(.tool.driver.name == "uv-audit")' \
               "${RUNNER_TEMP}/audit.sarif" > /dev/null 2>&1; then
            echo "::error::uv-audit が実行されませんでした（SARIFにuv-auditのrunが含まれていません）。"
            echo "次の操作: このステップのエラーと監査設定を確認し、修正後にAuditワークフローを再実行してください。"
            exit 1
          fi
          # pyfltrは全失敗をexit 1に正規化するため、終了コードだけでは脆弱性検出と
          # ツール異常を区別できない。非0時はSARIFの検出結果有無で分岐する。
          if [ "${audit_rc}" -ne 0 ]; then
            if jq -e '.runs[] | select(.tool.driver.name == "uv-audit") | .results | length > 0' \
                 "${RUNNER_TEMP}/audit.sarif" > /dev/null 2>&1; then
              # 脆弱性検出: SARIFをアップロードしCode Scanningに委ねる（次ステップ）。
              # ワークフローは成功扱いとする（Code Scanning側でアラートを管理するため）。
              echo "脆弱性が検出されました。Code Scanningへアップロードします。"
              echo "次の操作: repositoryのSecurity > Code scanningで依存のアラートを確認し、修正版への更新を検討してください。"
            else
              # ツール異常: 空のSARIFをアップロードすると既存アラートが誤クローズされるため、
              # アップロードせずワークフローを失敗させる。
              echo "::error::uv-audit の実行に失敗しました（SARIFに検出結果がありません）。"
              echo "次の操作: このステップのエラーとネットワーク接続を確認し、解消後にAuditワークフローを再実行してください。"
              exit 1
            fi
          fi

      - name: SARIFをCode Scanningへアップロード
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: ${{ runner.temp }}/audit.sarif
          category: uv-audit

  rust-audit:
    # cargo-auditの導入はソースからのビルドでCリンカーを要し、pyfltrイメージには含まれない。
    # ci-rust-lintと同じく、コンテナーを使わずホストのrunnerでmiseのRustを使う。
    runs-on: ubuntu-latest
    # Rustの検出はCode Scanningへ送らず、ジョブの失敗とログに残すため書き込み権限は要らない。
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Rust監査ツールの導入
        run: mise exec -- cargo install --locked --no-default-features cargo-audit

      - name: Rust依存の監査
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/rust-audit.json"
          audit_rc=0
          mise exec -- cargo audit --file rust/claude-statusline/Cargo.lock --json > "${report}" || audit_rc=$?
          if ! jq -e -s 'length == 1 and (.[0].vulnerabilities.found | type == "boolean")' "${report}" > /dev/null; then
            echo "::error::Rust監査の結果を取得できません。導入・接続・cargo-auditの診断を確認し、Auditを再実行してください。"
            exit 1
          fi
          cat "${report}"
          if jq -e '.vulnerabilities.found == true' "${report}" > /dev/null; then
            echo "::error::rust/claude-statusline/Cargo.lockに既知の脆弱性があります。上記のRustSec情報を確認して依存を更新してください。"
            exit 1
          fi
          if [ "${audit_rc}" -ne 0 ]; then
            echo "::error::cargo-auditが異常終了しました。診断と接続を確認し、Auditを再実行してください。"
            exit "${audit_rc}"
          fi
          echo "Rust監査完了: rust/claude-statusline/Cargo.lockに既知の脆弱性はありません。"
