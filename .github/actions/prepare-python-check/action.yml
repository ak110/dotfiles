name: prepare-python-check
description: prepare-python-checkの実処理
inputs:
  cache-key:
    description: 検査と分割を識別するキャッシュキー
    required: true
  native:
    description: ネイティブ依存を導入する
    default: 'true'
runs:
  using: composite
  steps:
    - name: safe.directory の設定
      # containerのrootとcheckoutの所有者が異なるため、後続のGit呼び出しを許可する。
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      shell: bash
    - name: ネイティブ依存インストール
      # PDF・アーカイブの試験とactions/cacheの圧縮に必要なため、キャッシュ復元前に導入する。
      run: |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends poppler-utils libarchive13 zstd
      if: inputs.native == 'true'
      shell: bash
    - name: chezmoi インストール
      uses: ./.github/actions/install-chezmoi
      with:
        bin-dir: /usr/local/bin
      if: inputs.native == 'true'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /cache
        # 検査と分割のキーを分け、再実行でも更新されたキャッシュを保存する。
        key: pyfltr-cache-${{ runner.os }}-py${{ env.UV_PYTHON }}-${{ inputs.cache-key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: pyfltr-cache-${{ runner.os }}-py${{ env.UV_PYTHON }}-${{ inputs.cache-key }}-
    - name: Install dependencies
      run: uv sync --all-groups --all-extras
      shell: bash
