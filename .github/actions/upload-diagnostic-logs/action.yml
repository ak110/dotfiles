name: upload-diagnostic-logs
description: agent-toolkitの状態領域にある診断ログをartifactへ保存する
# 管理サービスの標準エラーとupdate-dotfilesの永続ログはrunnerの破棄とともに消え、
# job出力が示す診断ファイルを後から読めないため、失敗したjobの原因調査用に保存する。
# 対象はCIのhomeの状態領域と、更新検証（check_update_dotfiles_upgrade.py）がrunner.tempに作る検証homeの状態領域である。
# Windowsではhome（C:）とrunner.temp（D:）のドライブが異なり、upload-artifactは1回の保存で複数ドライブの
# パターンを扱えない（共通の親を求められず失敗する）ため、保存元ごとにstepを分ける。
# pytestなどログを作る前の工程で失敗した場合は対象が無いため、警告を出さずに終える。
runs:
  using: composite
  steps:
    - name: 診断ログの保存 (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: diagnostic-logs-${{ github.job }}-${{ github.run_attempt }}
        path: |
          ~/.local/state/agent-toolkit/*.log*
          ~/.local/state/agent-toolkit/services/agents-server/*
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: 診断ログの保存 (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: diagnostic-logs-${{ github.job }}-${{ github.run_attempt }}
        path: |
          ~/AppData/Local/agent-toolkit/*.log*
          ~/AppData/Local/agent-toolkit/services/agents-server*/*
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: 更新検証homeの診断ログを伏字化して収集
      if: always()
      shell: pwsh
      run: |
        $copyScript = Join-Path $env:GITHUB_ACTION_PATH '../../../scripts/ci_copy_diagnostic.py'
        function Copy-DiagnosticFile($source, $target) {
          try {
            New-Item -ItemType Directory -Path $target -Force -ErrorAction Stop | Out-Null
            $targetFile = Join-Path $target (Split-Path -Leaf $source)
            uv run --no-project --no-config python $copyScript $source $targetFile
            if ($LASTEXITCODE -ne 0) { throw "診断の伏字化に失敗しました（終了コード: $LASTEXITCODE）" }
          } catch {
            Write-Warning "診断ファイルを回収できませんでした: ${source}: $_"
          }
        }

        $destination = Join-Path $env:RUNNER_TEMP 'upgrade-diagnostics'
        foreach ($root in Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'update-dotfiles-upgrade-*') {
          foreach ($relative in @('home/AppData/Local/agent-toolkit', 'home/.local/state/agent-toolkit')) {
            $state = Join-Path $root.FullName $relative
            if (-not (Test-Path -LiteralPath $state -PathType Container)) { continue }
            $target = Join-Path $destination "$($root.Name)/$relative"
            foreach ($file in Get-ChildItem -LiteralPath $state -File -Filter '*.log*' -Force) {
              Copy-DiagnosticFile $file.FullName $target
            }
            $report = Join-Path $state 'sync-report.json'
            if (Test-Path -LiteralPath $report -PathType Leaf) {
              Copy-DiagnosticFile $report $target
            }
            $services = Join-Path $state 'services'
            if (-not (Test-Path -LiteralPath $services -PathType Container)) { continue }
            foreach ($service in Get-ChildItem -LiteralPath $services -Directory -Filter 'agents-server*' -Force) {
              foreach ($file in Get-ChildItem -LiteralPath $service.FullName -File -Filter '*.log*' -Force) {
                $serviceTarget = Join-Path $target "services/$($service.Name)"
                Copy-DiagnosticFile $file.FullName $serviceTarget
              }
            }
          }
        }
    - name: 更新検証homeの伏字化した診断ログの保存
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: diagnostic-logs-upgrade-home-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/upgrade-diagnostics/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
