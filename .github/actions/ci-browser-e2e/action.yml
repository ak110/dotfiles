name: ci-browser-e2e
description: ci-browser-e2eの実処理
runs:
  using: composite
  steps:
    - name: safe.directory の設定
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      shell: bash
    - name: ネイティブ依存インストール
      run: |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends make
      shell: bash
    - name: Install dependencies
      run: uv sync --all-groups --all-extras
      shell: bash
    - name: Playwright Chromiumの導入
      run: make setup-browser
      shell: bash
    - name: ブラウザーE2E
      id: pytest
      run: |
        junit="$RUNNER_TEMP/browser-e2e-junit.xml"
        printf 'junit=%s\n' "$junit" >> "$GITHUB_OUTPUT"
        uv run pytest -v -m browser agent-toolkit/agent_toolkit/_atk/serve -o addopts='' \
          -p no:cacheprovider -p agent_toolkit._testing.pytest_plugin --junitxml="$junit"
      shell: bash
    - name: ブラウザー失敗証拠の保存
      if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: browser-failure-${{ github.job }}-${{ strategy.job-index }}
        path: ${{ runner.temp }}/browser-failure-*
        if-no-files-found: ignore
    - name: ブラウザーE2EのJUnit XMLを保存
      if: >-
        ${{ !cancelled() && steps.pytest.outputs.junit != '' &&
            (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
      # 成果物の保存に失敗しても、ブラウザーテストの成否を変えない。
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: browser-e2e-junit
        path: ${{ steps.pytest.outputs.junit }}
        if-no-files-found: ignore
