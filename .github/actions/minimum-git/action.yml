name: minimum-git
description: minimum-gitの実処理
runs:
  using: composite
  steps:
    # 取得先ミラーの名前解決の障害でjobが失敗しないよう、検証済みの取得物を再利用する。
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/minimum-git-deb
        key: minimum-git-deb-0a0bd5c85eafb688025d68e69f49919591b22abf8b7d608d7e64307714d361ca
    - name: Git 2.34.1の導入
      # READMEの最低対応版を別パスへ展開し、runnerのGitを置き換えず実Git試験へ渡す。
      id: minimum-git
      env:
        GIT_DEB: git_2.34.1-1ubuntu1_amd64.deb
        GIT_DEB_SHA256: 0a0bd5c85eafb688025d68e69f49919591b22abf8b7d608d7e64307714d361ca
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/minimum-git"
        deb_dir="$RUNNER_TEMP/minimum-git-deb"
        mkdir -p "$root" "$deb_dir"
        # キャッシュが無いときだけ取得する。取得先の名前解決などの一時的な失敗でjob全体が失敗しないよう、
        # 各取得先を3回まで再試行し、運営元の異なるミラーへ順に切り替える（同じファイルをsha256で検証する）。
        if [ ! -s "$deb_dir/$GIT_DEB" ]; then
          for base in http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
            if curl -sSfL --retry 3 --retry-all-errors --retry-delay 5 -o "$deb_dir/$GIT_DEB" "$base/pool/main/g/git/$GIT_DEB"; then
              break
            fi
          done
        fi
        echo "$GIT_DEB_SHA256  $deb_dir/$GIT_DEB" | sha256sum -c -
        dpkg -x "$deb_dir/$GIT_DEB" "$root/extract"
        printf '#!/bin/sh\nGIT_EXEC_PATH=%s/usr/lib/git-core exec %s/usr/bin/git "$@"\n' "$root/extract" "$root/extract" > "$root/git"
        chmod +x "$root/git"
        "$root/git" --version | grep -Fx "git version 2.34.1"
        echo "git=$root/git" >> "$GITHUB_OUTPUT"
      shell: bash
outputs:
  git:
    description: 最低対応Gitの実行パス
    value: ${{ steps.minimum-git.outputs.git }}
