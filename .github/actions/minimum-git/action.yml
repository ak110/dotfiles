name: minimum-git
description: minimum-gitの実処理
runs:
  using: composite
  steps:
    - name: Git 2.34.1の導入
      # READMEの最低対応版を別パスへ展開し、runnerのGitを置き換えず実Git試験へ渡す。
      id: minimum-git
      env:
        GIT_DEB: git_2.34.1-1ubuntu1_amd64.deb
        GIT_DEB_SHA256: 0a0bd5c85eafb688025d68e69f49919591b22abf8b7d608d7e64307714d361ca
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/minimum-git"
        mkdir -p "$root"
        # 取得先の名前解決などの一時的な失敗でjob全体が失敗しないよう、各取得先を3回まで再試行し、
        # GitHubのrunnerが標準で使うAzureのミラーから順に試す（同じファイルをsha256で検証する）。
        for host in azure.archive.ubuntu.com archive.ubuntu.com; do
          if curl -sSfL --retry 3 --retry-all-errors --retry-delay 5 -o "$root/$GIT_DEB" "http://$host/ubuntu/pool/main/g/git/$GIT_DEB"; then
            break
          fi
        done
        echo "$GIT_DEB_SHA256  $root/$GIT_DEB" | sha256sum -c -
        dpkg -x "$root/$GIT_DEB" "$root/extract"
        printf '#!/bin/sh\nGIT_EXEC_PATH=%s/usr/lib/git-core exec %s/usr/bin/git "$@"\n' "$root/extract" "$root/extract" > "$root/git"
        chmod +x "$root/git"
        "$root/git" --version | grep -Fx "git version 2.34.1"
        echo "git=$root/git" >> "$GITHUB_OUTPUT"
      shell: bash
outputs:
  git:
    description: 最低対応Gitの実行パス
    value: ${{ steps.minimum-git.outputs.git }}
