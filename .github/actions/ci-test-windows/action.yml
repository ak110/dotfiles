name: ci-test-windows
description: ci-test-windowsの実処理
runs:
  using: composite
  steps:
    - uses: ./dotfiles/.github/actions/prepare-install-test
    - name: Windows境界テスト
      shell: pwsh
      working-directory: ${{ env.DOTFILES_DIR }}
      run: uv run --frozen --python 3.15 pytest -v -m windows --maxfail=0 --cpu-limit-record-only --junitxml="$env:RUNNER_TEMP/pytest-windows-junit.xml"
    - name: Windows境界テストのJUnit XMLを保存
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pytest-windows-junit-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pytest-windows-junit.xml
        if-no-files-found: error
        retention-days: 1
    - name: Codex CLI 0.163.0の導入
      shell: pwsh
      run: '& "$env:DOTFILES_DIR\scripts\ci_install_codex.ps1"'
    - name: Windows Codex command integration
      shell: pwsh
      working-directory: ${{ env.DOTFILES_DIR }}
      run: '& "$env:DOTFILES_DIR\scripts\ci_codex_integration.ps1"'
    - name: 公開入口ランチャーの動作確認
      shell: pwsh
      working-directory: ${{ env.DOTFILES_DIR }}
      run: uv run --frozen --python 3.15 pytest -v -p no:cacheprovider --cpu-limit-record-only bin/atk_launcher_test.py bin/update_dotfiles_launcher_test.py
    - name: 失敗時の診断ログを保存
      # 時間上限で止まったjobはcancelledで終わるため、その場合も原因調査用のログを残す。
      if: ${{ failure() || cancelled() }}
      uses: ./dotfiles/.github/actions/upload-diagnostic-logs
