name: ci-test-windows
description: ci-test-windowsの実処理
runs:
  using: composite
  steps:
    - uses: ./dotfiles/.github/actions/prepare-install-test
    - name: Windows境界テスト
      shell: pwsh
      working-directory: ${{ env.DOTFILES_DIR }}
      run: uv run --python 3.15 pytest -v -m windows
    - name: Codex CLI 0.163.0の導入
      shell: pwsh
      run: '& "$env:DOTFILES_DIR\scripts\ci_install_codex.ps1"'
    - name: Windows Codex command integration
      shell: pwsh
      working-directory: ${{ env.DOTFILES_DIR }}
      run: '& "$env:DOTFILES_DIR\scripts\ci_codex_integration.ps1"'
    - name: 公開入口ランチャーの動作確認
      shell: pwsh
      working-directory: ${{ env.DOTFILES_DIR }}
      run: uv run --frozen --python 3.15 pytest -v -p no:cacheprovider bin/atk_launcher_test.py bin/update_dotfiles_launcher_test.py
    - name: install.ps1から初回導入とバックアップを検証
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # setup-uvはツールのシムをrunner専用の一時領域へ置く設定を加える。初回導入は通常のユーザー配置
        # （`~\.local\bin`）を前提に後処理を起動するため、その配置へ戻してdotfilesユーザーと同じ導入経路を検証する。
        $env:UV_TOOL_BIN_DIR = Join-Path $env:USERPROFILE '.local\bin'
        $existing = '" dotfiles CI: initial configuration' + [Environment]::NewLine
        $target = Join-Path $env:USERPROFILE '.vimrc'
        [IO.File]::WriteAllText($target, $existing, [Text.UTF8Encoding]::new($false))
        & "$env:DOTFILES_DIR\install.ps1" -Mode full
        # 導入モードはplatformdirsのuser_config_dirと同じ領域（Windowsでは%LOCALAPPDATA%）へ保存される。
        $config = Get-Content (Join-Path $env:LOCALAPPDATA 'agent-toolkit\config.json') -Raw | ConvertFrom-Json
        if ($config.dotfiles_mode -ne 'full') { throw '導入モードが保存されていません。install.ps1のログを確認してください。' }
        $backups = @(Get-ChildItem (Join-Path $env:USERPROFILE '.dotfiles-backup') -Filter '.vimrc' -Recurse -File |
          Where-Object { [IO.File]::ReadAllText($_.FullName) -ceq $existing })
        if ($backups.Count -eq 0) { throw '元の設定を復元できるバックアップがありません。install.ps1のログを確認してください。' }
        $expected = Join-Path $env:DOTFILES_DIR '.chezmoi-source/dot_vimrc'
        if ((Get-FileHash $target).Hash -ne (Get-FileHash $expected).Hash) { throw '.vimrcが適用されていません。chezmoiのログを確認してください。' }
    - name: 主要ファイルの存在確認
      shell: pwsh
      run: '& "$env:DOTFILES_DIR\scripts\ci_verify_windows.ps1"'
