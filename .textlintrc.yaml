rules:
  preset-ja-technical-writing:
    # ラベル型見出し（"ポイント:"、"例:" など）が多用されるため文末句点の強制を無効化する
    ja-no-mixed-period: false
    # 技術文書における自然な助詞連結（「〜かどうかを検討するか」など）が頻出するため無効化する
    no-doubled-joshi: false
    # 全角丸括弧の閉じが改行をまたぐ書き方を誤検出するため無効化する
    no-unmatched-pair: false
    # 入れ子括弧の閉じ`））`連続を誤検出するため無効化する
    ja-no-successive-word: false
    # 引用文や詳細な技術説明で 120 文字超過が避けられないため緩和する
    sentence-length:
      max: 150
    # agent.md の「ドキュメントは常体」方針と整合させる
    no-mix-dearu-desumasu:
      preferInHeader: ""
      preferInBody: "である"
      preferInList: "である"
      strict: false
    # 専門用語の複合語で閾値超過が頻発し修正の手間だけがかさむため無効化する
    max-kanji-continuous-len: false
  preset-jtf-style:
    "1.1.3.箇条書き":
      shouldUsePoint: false # 箇条書きは「。」を付けない
    # 和文の半角ピリオド・カンマ禁止ルール。`.gitignore`等のコード識別子の半角ピリオドを
    # 句点へ自動変換して破壊するため無効化する（lintは通過し検出できないため）
    "1.2.1.句点(。)と読点(、)": false
    "4.1.3.ピリオド(.)、カンマ(,)": false
    # 改行折り返し時に全角括弧の前後スペースを誤検出するため無効化する
    "3.3.かっこ類と隣接する文字の間のスペースの有無": false
    # コロン終端のラベル記法を多用するため無効化する
    "4.2.7.コロン(：)": false
    # 半角大かっこの全角自動変換が計画ファイルの差分ラベル（`[現行]`等）を破壊するため無効化する
    "4.3.2.大かっこ［］": false
    # 半角丸かっこの全角自動変換がコード識別子を含む括弧を破壊するため無効化する
    "4.3.1.丸かっこ（）": false
    # ja-technical-writing/no-mix-dearu-desumasuと同一観点を重複検出するため無効化する
    "1.1.1.本文": false
    # writing-standards本文の「見出しは名詞句で書く」規定と重複するため無効化する
    "1.1.2.見出し": false
  ja-no-abusage: true
  # コーディングエージェントのコンテキスト汚染対策として独自強化する辞書を読み込む
  prh:
    rulePaths:
      - "./prh.yml"
